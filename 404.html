<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';" />
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
  <title>Page Not Found — Wayline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root { --wayline: #CB7F00; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background: #0f0f0f;
      background-image: url('patterns/hero.svg');
      background-repeat: repeat;
      background-size: 80px 80px;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 50% 50%, rgba(203,127,0,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .code {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 700;
      color: var(--wayline);
      line-height: 1;
      letter-spacing: -0.04em;
    }
    h1 { font-size: clamp(1.4rem, 4vw, 2rem); margin: 1rem 0 0.75rem; }
    p { color: rgba(255,255,255,0.55); font-size: 1rem; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: var(--wayline);
      color: #fff;
      padding: 0.75rem 1.75rem;
      border-radius: 0.4rem;
      font-weight: 600;
      text-decoration: none;
      transition: filter 0.2s;
    }
    a:hover { filter: brightness(1.12); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a href="/">Back to Wayline</a>
</body>
</html>
