<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160">
  <!-- Hand-drawn transit map: slightly irregular curves evoke a printed pocket map -->
  <!-- Line A (top) -->
  <path d="M0,38 C50,36 100,42 150,39 C175,37 192,40 200,38"
        stroke="rgba(18,161,154,0.28)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Line B (middle) -->
  <path d="M0,80 C40,82 90,78 130,80 C165,82 188,79 200,80"
        stroke="rgba(18,161,154,0.18)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Line C (bottom) -->
  <path d="M0,122 C45,120 95,124 148,121 C172,119 192,123 200,122"
        stroke="rgba(18,161,154,0.28)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Cross-town connectors -->
  <path d="M60,0 C62,40 58,90 60,130 C62,150 59,158 60,160"
        stroke="rgba(18,161,154,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M140,0 C138,45 142,95 140,135 C138,150 141,158 140,160"
        stroke="rgba(18,161,154,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Station rings at major intersections -->
  <circle cx="60"  cy="38"  r="5" fill="none" stroke="rgba(18,161,154,0.48)" stroke-width="1.5"/>
  <circle cx="140" cy="38"  r="5" fill="none" stroke="rgba(18,161,154,0.48)" stroke-width="1.5"/>
  <circle cx="60"  cy="122" r="5" fill="none" stroke="rgba(18,161,154,0.48)" stroke-width="1.5"/>
  <circle cx="140" cy="122" r="5" fill="none" stroke="rgba(18,161,154,0.48)" stroke-width="1.5"/>
  <!-- Interchange dots -->
  <circle cx="60"  cy="80" r="3" fill="rgba(18,161,154,0.32)"/>
  <circle cx="140" cy="80" r="3" fill="rgba(18,161,154,0.32)"/>
  <!-- Terminal caps -->
  <circle cx="0"   cy="38"  r="2.5" fill="rgba(18,161,154,0.2)"/>
  <circle cx="200" cy="38"  r="2.5" fill="rgba(18,161,154,0.2)"/>
  <circle cx="0"   cy="122" r="2.5" fill="rgba(18,161,154,0.2)"/>
  <circle cx="200" cy="122" r="2.5" fill="rgba(18,161,154,0.2)"/>
</svg>
