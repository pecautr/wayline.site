<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Architectural street grid: slightly imperfect, evoking a hand-drawn plan -->
  <!-- Main avenues -->
  <path d="M0,60 C20,59 50,61 80,60 C100,59 115,61 120,60"
        stroke="rgba(0,122,31,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M60,0 C59,20 61,50 60,80 C59,100 61,115 60,120"
        stroke="rgba(0,122,31,0.22)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Side streets -->
  <path d="M0,30 C25,29 60,31 90,30 C108,29 118,31 120,30"
        stroke="rgba(0,122,31,0.11)" stroke-width="0.75" fill="none" stroke-linecap="round"/>
  <path d="M0,90 C22,89 58,91 88,90 C108,89 118,91 120,90"
        stroke="rgba(0,122,31,0.11)" stroke-width="0.75" fill="none" stroke-linecap="round"/>
  <path d="M30,0 C29,25 31,58 30,88 C29,108 31,118 30,120"
        stroke="rgba(0,122,31,0.11)" stroke-width="0.75" fill="none" stroke-linecap="round"/>
  <path d="M90,0 C89,28 91,58 90,90 C89,108 91,118 90,120"
        stroke="rgba(0,122,31,0.11)" stroke-width="0.75" fill="none" stroke-linecap="round"/>
  <!-- Diagonal boulevard (arterial) -->
  <line x1="0" y1="0" x2="120" y2="120" stroke="rgba(0,122,31,0.16)" stroke-width="1"/>
  <!-- Block hatching (blueprint cross-hatch on select blocks) -->
  <line x1="32" y1="2"  x2="58" y2="2"  stroke="rgba(0,122,31,0.07)" stroke-width="0.5"/>
  <line x1="32" y1="6"  x2="58" y2="6"  stroke="rgba(0,122,31,0.07)" stroke-width="0.5"/>
  <line x1="32" y1="10" x2="58" y2="10" stroke="rgba(0,122,31,0.07)" stroke-width="0.5"/>
  <line x1="32" y1="14" x2="58" y2="14" stroke="rgba(0,122,31,0.07)" stroke-width="0.5"/>
  <line x1="32" y1="18" x2="58" y2="18" stroke="rgba(0,122,31,0.07)" stroke-width="0.5"/>
  <line x1="32" y1="22" x2="58" y2="22" stroke="rgba(0,122,31,0.07)" stroke-width="0.5"/>
  <line x1="32" y1="26" x2="58" y2="26" stroke="rgba(0,122,31,0.07)" stroke-width="0.5"/>
  <!-- Intersection nodes -->
  <circle cx="60" cy="30" r="2" fill="rgba(0,122,31,0.18)"/>
  <circle cx="60" cy="90" r="2" fill="rgba(0,122,31,0.18)"/>
  <circle cx="30" cy="60" r="2" fill="rgba(0,122,31,0.18)"/>
  <circle cx="90" cy="60" r="2" fill="rgba(0,122,31,0.18)"/>
</svg>
