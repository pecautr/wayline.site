<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Main avenues (thicker) -->
  <line x1="0"  y1="60" x2="120" y2="60" stroke="rgba(0,122,31,0.22)" stroke-width="1.5"/>
  <line x1="60" y1="0"  x2="60"  y2="120" stroke="rgba(0,122,31,0.22)" stroke-width="1.5"/>
  <!-- Side streets (thinner) -->
  <line x1="0"  y1="30" x2="120" y2="30" stroke="rgba(0,122,31,0.12)" stroke-width="0.75"/>
  <line x1="0"  y1="90" x2="120" y2="90" stroke="rgba(0,122,31,0.12)" stroke-width="0.75"/>
  <line x1="30" y1="0"  x2="30"  y2="120" stroke="rgba(0,122,31,0.12)" stroke-width="0.75"/>
  <line x1="90" y1="0"  x2="90"  y2="120" stroke="rgba(0,122,31,0.12)" stroke-width="0.75"/>
  <!-- Diagonal boulevard (arterial) -->
  <line x1="0"   y1="0"   x2="120" y2="120" stroke="rgba(0,122,31,0.16)" stroke-width="1"/>
  <!-- City block fills -->
  <rect x="31"  y="1"  width="27" height="27" fill="rgba(0,122,31,0.05)" rx="1"/>
  <rect x="61"  y="31" width="27" height="27" fill="rgba(0,122,31,0.05)" rx="1"/>
  <rect x="1"   y="61" width="27" height="27" fill="rgba(0,122,31,0.05)" rx="1"/>
  <rect x="91"  y="91" width="27" height="27" fill="rgba(0,122,31,0.05)" rx="1"/>
  <!-- Intersection nodes on main avenues -->
  <circle cx="60" cy="30" r="2" fill="rgba(0,122,31,0.18)"/>
  <circle cx="60" cy="90" r="2" fill="rgba(0,122,31,0.18)"/>
  <circle cx="30" cy="60" r="2" fill="rgba(0,122,31,0.18)"/>
  <circle cx="90" cy="60" r="2" fill="rgba(0,122,31,0.18)"/>
</svg>
